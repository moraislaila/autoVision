<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVision</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img id="fotoPerfil" class="avatar" src="./assets/logo.png" alt="Avatar">
        <div class="user-section oculta" id="userSection">
            <span id="nomeUsuario"></span>
            <button id="btnVerPerfil" class="btn-preto">Ver perfil</button>
        </div>

        <h1 class="empresa">AutoVision</h1>
        <button id="btnLogin" class="btn-preto">Entrar</button>
    </header>
    <main>
        <div class="busca">
            <input id="inputBusca" placeholder="Digite o modelo do carro">
            <img src="./assets/lupa.svg" alt="Buscar" class="icone-lupa">
        </div>
        <div id="vitrine" class="vitrine"></div>
    </main>
    <footer>
        <span>AutoVision</span>
        <div class="redes">
            <img src="./assets/instagram.svg" alt="Instagram">
            <img src="./assets/tiktok.svg" alt="Tiktok">
            <img src="./assets/linkedin.svg" alt="Linkedin">
            <img src="./assets/youtube.svg" alt="Youtube">
        </div>
        <span>Copyright© 2026-2027</span>
    </footer>

    <!-- Modal de login -->
    <dialog id="modalLogin" class="overlay oculto">
        <div class="modal">
            <div class="modal-topo">
                <h2>Login</h2>
                <button id="fecharModal" class="btn-fechar">x</button>
            </div>
            <input type="text" id="loginUsuario" placeholder="Digite seu nome">
            <span id="erroUsuario" class="erro"></span>
            <input type="password" id="loginSenha" placeholder="Digite sua senha">
            <span id="erroSenha" class="erro"></span>
            <span id="erroLogin" class="erro"></span>
            <div class="modal-botoes">
                <button id="btnCancelar" class="btn-outline">Cancelar</button>
                <button id="btnConfirmarLogin" class="btn-preto">Login</button>
            </div>
        </div>
    </dialog>

    <!-- menu lateral de perfil -->
    <aside id="painelPerfil" class="painel-lateral oculto">
        <div class="painel-topo">
            <button id="fecharPainel" class="btn-fechar">x</button>
        </div>
        <p><span id="totalInteressados">0</span> Interessados</p>
        <p><span id="totalAnuncios">0</span> Anúncios</p>
        <button id="btnSeusAnuncios" class="btn-destaque">Seus Anúncios</button>

        <form id="formCadastro" enctype="multipart/form-data" novalidate>
            <div class="grupo-input">
                <label for="campoTitulo">Título do Anúncio</label>
                <input type="text" id="campoTitulo" name="titulo" placeholder="ex.: Honda Civic EXL 2020">
                <span id="erroTitulo" class="msg-erro"></span>
            </div>
            <div class="grupo-input">
                <label for="campoLocal">Localização</label>
                <input type="text" name="local" id="campoLocal" placeholder="ex.: Florianópolis-SC">
                <span id="erroLocal" class="msg-erro"></span>
            </div>
            <div class="grupo-input">
                <label for="campoPreco">Preço</label>
                <input type="number" name="preco" id="campoPreco" placeholder="ex.: R$ 79999.00" step="0.01">
                <span id="erroPreco" class="msg-erro"></span>
            </div>
            <div class="grupo-input">
                <label for="campoImagem">Foto do Veículo</label>
                <input id="campoImagem" type="file" name="imagem" accept=".jpg, .jpeg, .png, .gif, .webp">
                <span id="erroImagem" class="msg-erro"></span>
            </div>
            <button type="submit" class="btn-preto">Cadastrar</button>
        </form>

        <div id="listaAnunciosPerfil">
            <div class="item-perfil">
                <span>Vectra 2000 - R$25000,00</span>
                <img class="lixeira" src="assets/lixeira.svg" alt="">
            </div>
        </div>
    </aside>
    <!-- Modal de interesse (cliente sem ter feito login)-->
    <dialog id="modalInteresse" class="overlay oculto">
        <div class="modal">
            <div class="modal-topo">
                <h2>Tenho Interesse</h2>
                <button id="fecharModalInteresse" class="btn-fechar">x</button>
            </div>
            <input type="text" id="interesseNome" placeholder="Seu nome">
            <input type="text" id="interesseContato" placeholder="Telefone ou e-mail">
            <span id="erroInteresse" class="erro"></span>
            <div class="modal-botoes">
                <button id="btnCancelarInteresse" class="btn-outline">Cancelar</button>
                <button id="btnConfirmarInteresse" class="btn-preto">Confirmar</button>
            </div>
        </div>
    </dialog>

    <!-- feito na aula de hoje 08/10 -->
    <dialog id="modalMensagem" class="overlay oculto">
        <div class="modal"> 
            <div class="modal-topo">
                <h2>enviar Mensagem</h2>
                <button id="fecharModalMensagem" class="btn-fechar">x</button>
                <input type="text" id="mensagemNome" placeholder="Digite seu nome">
                <input type="text" id="mensagemContato" placeholder="Digite telefone ou e-mail">
                <textarea id="mensagemTexto" placeholder="Escreva sua mensagem"></textarea>
                <span id="erroMensagem" class="erro"></span>
                <div class="modal-botoes">
                    <button id="btnEnviarMensagem" class="btn-preto"> Enviar</button>
                </div>
            </div>
        </div>
    </dialog>

</body>

</html>
